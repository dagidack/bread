            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],

    <style>
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        /* Монохромная анимация логотипа Breaking Bread */
        @keyframes bbTileDrop {
            0% {
                opacity: 0;
                transform: scale(1.18) translateY(-8px);
            }
            65% {
                opacity: 1;
                transform: scale(0.98) translateY(0);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        @keyframes bbWordReveal {
            0% {
                opacity: 0;
                transform: translateX(-10px);
                letter-spacing: 0.08em;
            }
            100% {
                opacity: 1;
                transform: translateX(0);
                letter-spacing: -0.025em;
            }
        }
        @keyframes bbTileSheen {
            0%, 72%, 100% {
                transform: translateX(-140%) skewX(-20deg);
            }
            88% {
                transform: translateX(220%) skewX(-20deg);
            }
        }
        .bb-tile {
            position: relative;
            overflow: hidden;
            background-color: #111111;
            box-shadow: 0 10px 24px -10px rgba(0, 0, 0, 0.35);
            animation: bbTileDrop 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .bb-tile::after {
            content: '';
            position: absolute;
            inset: 0;
            width: 55%;
            background-color: rgba(255, 255, 255, 0.14);
            animation: bbTileSheen 6.5s ease-in-out infinite;
            pointer-events: none;
        }
        .bb-tile-delay {
            animation-delay: 0.16s;
        }
        .bb-tile-delay::after {
            animation-delay: 0.35s;
        }
        .bb-word {
            animation: bbWordReveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
        }
        .bb-word-delay {
            animation: bbWordReveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both;
        }
    </style>
</head>

        let currentView = 'home'; // 'home' | 'recipe'

        const STORAGE_KEY = 'breakingBreadState_v1';

        function saveGlobalState() {
            const state = {
                currentView,
                currentRecipeKey,
                savedRecipeParams,
                fermentModeByRecipe,
                completedSteps,
                activeStageByRecipe,
                completedStagesByRecipe,
                ciabattaFolds,
                pizzaBallsCount,
                bunsSplitCount,
                timers: {}
            };
            for (const [id, t] of Object.entries(timers)) {
                state.timers[id] = {
                    defaultSec: t.defaultSec,
                    remainingSec: t.running && t.endTimestamp ? Math.max(0, (t.endTimestamp - Date.now())/1000) : t.remainingSec,
                    running: t.running,
                    endTimestamp: t.endTimestamp,
                    showHours: t.showHours,
                    label: t.label,
                    recipeKey: t.recipeKey
                };
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function loadGlobalState() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (!data) return false;
                const parsed = JSON.parse(data);

                if (parsed.currentView) currentView = parsed.currentView;
                if (parsed.currentRecipeKey) currentRecipeKey = parsed.currentRecipeKey;

                Object.assign(savedRecipeParams, parsed.savedRecipeParams || {});
                Object.assign(fermentModeByRecipe, parsed.fermentModeByRecipe || {});
                Object.assign(completedSteps, parsed.completedSteps || {});
                Object.assign(activeStageByRecipe, parsed.activeStageByRecipe || {});
                Object.assign(completedStagesByRecipe, parsed.completedStagesByRecipe || {});

                if (parsed.ciabattaFolds) {
                    ciabattaFolds[0] = !!parsed.ciabattaFolds[0];
                    ciabattaFolds[1] = !!parsed.ciabattaFolds[1];
                    ciabattaFolds[2] = !!parsed.ciabattaFolds[2];
                }
                if (parsed.pizzaBallsCount) pizzaBallsCount = parsed.pizzaBallsCount;
                if (parsed.bunsSplitCount) bunsSplitCount = parsed.bunsSplitCount;

                if (parsed.timers) {
                    const now = Date.now();
                    for (const [id, t] of Object.entries(parsed.timers)) {
                        timers[id] = { ...t };
                        // Корректируем остаток времени, если таймер был запущен
                        if (t.running && t.endTimestamp) {
                            const remain = (t.endTimestamp - now) / 1000;
                            timers[id].remainingSec = remain <= 0 ? 0 : remain;
                            // Если remain <= 0, таймер остаётся "running", чтобы setInterval сразу же вызвал будильник
                        }
                    }
                }
                return true;
            } catch (e) {
                console.error("Ошибка загрузки состояния", e);
                return false;
            }
        }

        // Хранилище всех таймеров по уникальному ID (не сбрасываются при переходе назад)
        const timers = {};
        // Связь ID таймера с индексом этапа текущего рецепта
        let timerToStageIndex = {};

        function ensureTimer(id, config) {
            if (!timers[id]) {
                timers[id] = {
                    defaultSec: config.mins * 60,
                    remainingSec: config.mins * 60,
                    running: false,
                    endTimestamp: null,
                    showHours: Boolean(config.showHours),
                    label: config.label,
                    recipeKey: currentRecipeKey
                };
            }
            return timers[id];
        }

        /* ==========================================================================
           ЖИВАЯ WEB3 + CHEMISTRY АНИМАЦИЯ В ШАПКЕ
           ========================================================================== */
        const headerFx = {
            nodes: [],
            pulses: [],
            pointer: { x: -999, y: -999, active: false },
            width: 0,
            height: 0,
            initialized: false
        };

        function replayLogoAnimation() {
            const container = document.getElementById('bbLogoContainer');
            if (!container) return;
            const clone = container.cloneNode(true);
            container.parentNode.replaceChild(clone, container);
        }

        /* ==========================================================================
           УПРАВЛЕНИЕ ТЕКУЩИМ ЭТАПОМ (ЗЕЛЁНАЯ ОБВОДКА В 1 НАЖАТИЕ)
           ========================================================================== */
        function getRecipeStages(recipe) {
            const stages = [];
            recipe.blocks.forEach(block => {
                if (block.type === 'ferment2') {
                    stages.push({ short: block.stage1Short || '1.1 Подъём' });
                    stages.push({ short: block.stage2Short || '1.2 Расстойка' });
                } else if (block.type === 'bake2') {
                    stages.push({ short: block.stage1.short || '2.1 Этап 1' });
                    stages.push({ short: block.stage2.short || '2.2 Этап 2' });
                } else {
                    stages.push({ short: block.shortTitle || block.title });
                }
            });
            return stages;
        }

        function setActiveStage(stageIdx) {
            activeStageByRecipe[currentRecipeKey] = stageIdx;
            renderWorkflow();
            saveGlobalState();
        }

        function completeStage(stageIdx) {
            const recipe = RECIPES[currentRecipeKey];
            const totalStages = getRecipeStages(recipe).length;
            if (!completedStagesByRecipe[currentRecipeKey]) {
                completedStagesByRecipe[currentRecipeKey] = {};
            }
            completedStagesByRecipe[currentRecipeKey][stageIdx] = true;
            activeStageByRecipe[currentRecipeKey] = Math.min(totalStages, stageIdx + 1);
            renderWorkflow();
            saveGlobalState();
        }

        function resetStagesProgress() {
            completedStagesByRecipe[currentRecipeKey] = {};
            activeStageByRecipe[currentRecipeKey] = 0;
            renderWorkflow();
            saveGlobalState();
        }

        function handleStageCardClick(event, stageIdx) {
            if (event.target.closest('button, input, label, select, textarea')) return;
            if (activeStageByRecipe[currentRecipeKey] !== stageIdx) {
                setActiveStage(stageIdx);
            }
        }

        function renderStageBadgeAndAction(stageIdx, totalStages) {
            const activeIdx = activeStageByRecipe[currentRecipeKey] ?? 0;
            const doneMap = completedStagesByRecipe[currentRecipeKey] || {};
            const isActive = stageIdx === activeIdx;
            const isDone = Boolean(doneMap[stageIdx]);

            if (isActive) {
                const nextLabel = stageIdx >= totalStages - 1 ? 'Завершить ✓' : 'Готово →';
                return `
                    <div class="flex items-center gap-1.5 shrink-0">
                        <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-emerald-600 text-white text-[11px] font-semibold">
                            <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>Сейчас
                        </span>
                        <button type="button" onclick="completeStage(${stageIdx})" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg transition cursor-pointer">
                            ${nextLabel}
                        </button>
                    </div>
                `;
            }

            if (isDone) {
                return `<span class="px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-200 text-[11px] font-semibold shrink-0">✓ Готово</span>`;
            }

            return '';
        }

        function renderStageNavigator(stages) {
            const nav = document.getElementById('stageNavigator');
            const activeIdx = activeStageByRecipe[currentRecipeKey] ?? 0;
            const doneMap = completedStagesByRecipe[currentRecipeKey] || {};

            const pillsHtml = stages.map((st, idx) => {
                const isActive = idx === activeIdx;
                const isDone = Boolean(doneMap[idx]);

                let cls = 'px-2.5 py-1 rounded-lg text-xs font-medium transition cursor-pointer border ';
                if (isActive) {
                    cls += 'bg-emerald-600 text-white border-emerald-600 font-semibold shadow-2xs';
                } else if (isDone) {
                    cls += 'bg-emerald-50 text-emerald-800 border-emerald-200 hover:bg-emerald-100';
                } else {
                    cls += 'bg-white text-stone-600 border-stone-200 hover:border-stone-300 hover:text-stone-900';
                }

                const prefix = isDone && !isActive ? '✓ ' : '';
                return `<button type="button" onclick="setActiveStage(${idx})" class="${cls}">${prefix}${st.short}</button>`;
            }).join('');

            const allDone = activeIdx >= stages.length;
            const resetBtnHtml = (allDone || Object.keys(doneMap).length > 0)
                ? `<button type="button" onclick="resetStagesProgress()" class="ml-auto px-2.5 py-1 text-xs font-medium text-stone-500 hover:text-stone-900 bg-stone-200/70 hover:bg-stone-200 rounded-lg cursor-pointer">Сначала</button>`
                : '';

            nav.innerHTML = `${pillsHtml}${resetBtnHtml}`;
        }

        /* ==========================================================================
           ОТРИСОВКА ИНДИВИДУАЛЬНЫХ ЭТАПОВ РЕЦЕПТА
           ========================================================================== */
        function createTimerBoxHtml(timerId, title, badgeText, badgeId, presets, customUnit, customInitVal, onCustomChangeExpr, stageIdx, totalStages) {
            const activeIdx = activeStageByRecipe[currentRecipeKey] ?? 0;
            const isStageActive = stageIdx === activeIdx;

            const boxBorderClass = isStageActive
                ? 'border-2 border-emerald-500 ring-4 ring-emerald-500/15 bg-emerald-50/35'
                : 'border border-stone-200 bg-stone-50 hover:border-stone-300';

            const statusControlsHtml = renderStageBadgeAndAction(stageIdx, totalStages);

            const presetButtonsHtml = presets.map(p => {
                const badgeAttr = p.badge ? `data-badge="${p.badge}"` : '';
                return `<button type="button" ${badgeAttr} onclick="applyPreset('${timerId}', ${p.mins}, this.dataset.badge, '${badgeId || ''}')" class="px-2.5 py-1 text-xs font-mono bg-white border border-stone-200 hover:bg-stone-100 rounded-lg cursor-pointer">${p.label}</button>`;
            }).join('');

            return `
                <div onclick="handleStageCardClick(event, ${stageIdx})" class="p-3.5 ${boxBorderClass} rounded-xl space-y-2.5 transition cursor-pointer">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="text-xs font-bold text-stone-800">${title}</span>
                            ${badgeText ? `<span ${badgeId ? `id="${badgeId}"` : ''} class="px-2 py-0.5 bg-amber-100 text-amber-900 font-mono text-xs font-bold rounded-md shrink-0">${badgeText}</span>` : ''}
                        </div>
                        ${statusControlsHtml}
                    </div>

                    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 p-3 bg-stone-900 text-white rounded-xl">
                        <div>
                            <div id="display-${timerId}" class="font-mono text-2xl sm:text-3xl font-bold tracking-wider text-center sm:text-left tabular-nums">00:00</div>
                            <div id="clock-${timerId}" class="text-xs font-mono text-stone-400 text-center sm:text-left mt-0.5"></div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 sm:w-48">
                            <button id="btn-${timerId}" type="button" onclick="toggleTimer('${timerId}')" class="h-9 bg-amber-600 hover:bg-amber-500 text-white text-sm font-semibold rounded-lg transition cursor-pointer">
                                Старт
                            </button>
                            <button type="button" onclick="resetTimer('${timerId}')" class="h-9 bg-stone-700 hover:bg-stone-600 text-white text-sm font-medium rounded-lg transition cursor-pointer">
                                Сброс
                            </button>
                        </div>
                    </div>

                    <div class="flex flex-wrap items-center gap-1.5">
                        <div class="flex flex-wrap items-center gap-1.5">${presetButtonsHtml}</div>
                        <div class="flex items-center gap-1 ml-auto">
                            <input type="number" id="custom-${timerId}" value="${customInitVal}" min="0.5" step="0.5" onchange="${onCustomChangeExpr}" class="w-14 h-7 px-1.5 bg-white border border-stone-300 rounded-lg font-mono text-xs text-center">
                            <span id="unit-${timerId}" class="text-xs text-stone-500">${customUnit}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderWorkflow() {
            const recipe = RECIPES[currentRecipeKey];
            const container = document.getElementById('workflowContainer');
            container.innerHTML = '';
            timerToStageIndex = {};

            const stages = getRecipeStages(recipe);
            const totalStages = stages.length;
            const activeIdx = activeStageByRecipe[currentRecipeKey] ?? 0;
            renderStageNavigator(stages);

            const activeTimerIds = [];
            let stageCursor = 0;

            recipe.blocks.forEach((block, bIdx) => {
                const section = document.createElement('section');

                if (block.type === 'steps') {
                    const sIdx = stageCursor++;
                    const isStageActive = sIdx === activeIdx;
                    section.onclick = (e) => handleStageCardClick(e, sIdx);
                    section.className = isStageActive
                        ? 'bg-emerald-50/20 border-2 border-emerald-500 ring-4 ring-emerald-500/15 rounded-2xl p-4 sm:p-6 shadow-sm space-y-4 transition cursor-pointer'
                        : 'bg-white border border-stone-300 hover:border-stone-400 rounded-2xl p-4 sm:p-6 shadow-sm space-y-4 transition cursor-pointer';

                    const stepState = completedSteps[currentRecipeKey] || {};
                    const itemsHtml = block.steps.map((text, stepIdx) => {
                        const done = Boolean(stepState[stepIdx]);
                        return `
                            <label class="flex items-start gap-3 p-3 rounded-xl border transition cursor-pointer select-none ${done ? 'bg-stone-100/70 border-stone-200 text-stone-400' : 'bg-white/90 border-stone-200 hover:border-stone-300 text-stone-800'}">
                                <input type="checkbox" ${done ? 'checked' : ''} onchange="toggleRecipeStep(${stepIdx}, this.checked)" class="mt-0.5 w-4 h-4 rounded accent-emerald-600 cursor-pointer shrink-0">
                                <span class="text-xs sm:text-[13px] leading-relaxed ${done ? 'line-through' : ''}">
                                    <strong class="font-mono mr-1">${stepIdx + 1}.</strong>${text}
                                </span>
                            </label>
                        `;
                    }).join('');

                    section.innerHTML = `
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <div>
                                <h2 class="text-base font-bold text-stone-900">${block.title}</h2>
                                <span class="text-xs text-stone-500">${block.subtitle || ''}</span>
                            </div>
                            ${renderStageBadgeAndAction(sIdx, totalStages)}
                        </div>
                        <div class="space-y-2">${itemsHtml}</div>
                    `;
                } else if (block.type === 'ferment2') {
                    const s1Idx = stageCursor++;
                    const s2Idx = stageCursor++;
                    const hasActiveChild = (activeIdx === s1Idx || activeIdx === s2Idx);
                    section.className = hasActiveChild
                        ? 'bg-white border-2 border-emerald-300 rounded-2xl p-4 sm:p-6 shadow-sm space-y-4 transition'
                        : 'bg-white border border-stone-300 rounded-2xl p-4 sm:p-6 shadow-sm space-y-4 transition';

                    const mode = fermentModeByRecipe[currentRecipeKey] || 'warm';
                    const isCold = mode === 'cold';
                    const t1Id = `${currentRecipeKey}_fermentMain`;
                    const t2Id = `${currentRecipeKey}_fermentProof`;
                    timerToStageIndex[t1Id] = s1Idx;
                    timerToStageIndex[t2Id] = s2Idx;

                    ensureTimer(t1Id, {
                        mins: isCold ? block.coldMins : block.warmMins,
                        showHours: true,
                        label: `${recipe.tabLabel}: основной подъём завершён`
                    });
                    ensureTimer(t2Id, {
                        mins: block.proofMins,
                        showHours: false,
                        label: `${recipe.tabLabel}: расстойка завершена`
                    });

                    activeTimerIds.push(t1Id, t2Id);

                    const mainPresets = isCold ? FERMENT_PRESETS.cold : FERMENT_PRESETS.warm;
                    const t1Sec = timers[t1Id].defaultSec;
                    const customInitVal = isCold ? Math.round((t1Sec / 3600) * 10) / 10 : Math.round(t1Sec / 60);
                    const customUnit = isCold ? 'ч' : 'мин';

                    const foldsHtml = block.extraWidget === 'ciabattaFolds'
                        ? `<div class="p-3 bg-amber-50/70 border border-amber-200/80 rounded-xl space-y-2">
                               <div class="flex items-center justify-between gap-2">
                                   <span class="text-xs font-bold text-stone-800">Складывания конвертом (каждые 30 мин)</span>
                                   <span class="text-[11px] text-stone-500">Мокрыми руками, не мять</span>
                               </div>
                               <div class="grid grid-cols-3 gap-2">
                                   ${[0, 1, 2].map(idx => `
                                       <label class="flex items-center justify-center gap-1.5 py-1.5 px-2 bg-white border border-stone-200 rounded-lg text-xs font-medium cursor-pointer select-none">
                                           <input type="checkbox" ${ciabattaFolds[idx] ? 'checked' : ''} onchange="ciabattaFolds[${idx}] = this.checked; saveGlobalState();" class="w-3.5 h-3.5 rounded accent-stone-900 cursor-pointer">
                                           <span>Склад. ${idx + 1}</span>
                                       </label>
                                   `).join('')}
                               </div>
                           </div>`
                        : '';

                    section.innerHTML = `
                        <div class="flex flex-wrap items-start justify-between gap-2">
                            <div>
                                <h2 class="text-base font-bold text-stone-900">${block.title}</h2>
                                <p class="text-xs text-stone-500 mt-0.5">${isCold ? block.coldHint : block.warmHint}</p>
                            </div>
                            <div class="inline-flex p-1 bg-stone-100 border border-stone-200 rounded-lg text-xs shrink-0">
                                <button type="button" onclick="setFermentMode('warm')" class="px-2.5 py-1 rounded-md cursor-pointer transition ${!isCold ? 'font-semibold bg-white text-stone-900 shadow-2xs' : 'font-medium text-stone-600 hover:text-stone-900'}">
                                    В тепле
                                </button>
                                <button type="button" onclick="setFermentMode('cold')" class="px-2.5 py-1 rounded-md cursor-pointer transition ${isCold ? 'font-semibold bg-white text-stone-900 shadow-2xs' : 'font-medium text-stone-600 hover:text-stone-900'}">
                                    Холодильник
                                </button>
                            </div>
                        </div>

                        ${createTimerBoxHtml(
                            t1Id,
                            block.stage1Title,
                            isCold ? 'Холодильник (+4…+6 °C)' : 'В тепле',
                            null,
                            mainPresets,
                            customUnit,
                            customInitVal,
                            `onFermentCustomChange('${t1Id}', this.value)`,
                            s1Idx,
                            totalStages
                        )}

                        ${foldsHtml}

                        <div class="space-y-1.5">
                            <div class="text-[11px] text-stone-500 px-1">${isCold ? block.proofColdHint : block.proofWarmHint}</div>
                            ${createTimerBoxHtml(
                                t2Id,
                                block.stage2Title,
                                null,
                                null,
                                block.proofPresets,
                                'мин',
                                Math.round(timers[t2Id].defaultSec / 60),
                                `setTimerMinutes('${t2Id}', this.value)`,
                                s2Idx,
                                totalStages
                            )}
                        </div>
                    `;
                } else if (block.type === 'singleTimer') {
                    const sIdx = stageCursor++;
                    const isStageActive = sIdx === activeIdx;
                    section.onclick = (e) => handleStageCardClick(e, sIdx);
                    section.className = isStageActive
                        ? 'bg-emerald-50/20 border-2 border-emerald-500 ring-4 ring-emerald-500/15 rounded-2xl p-4 sm:p-6 shadow-sm space-y-4 transition cursor-pointer'
                        : 'bg-white border border-stone-300 hover:border-stone-400 rounded-2xl p-4 sm:p-6 shadow-sm space-y-4 transition cursor-pointer';

                    const tId = `${currentRecipeKey}_single_${bIdx}`;
                    timerToStageIndex[tId] = sIdx;
                    ensureTimer(tId, {
                        mins: block.mins,
                        showHours: false,
                        label: `${recipe.tabLabel}: ${block.title.replace(/^\d+\.\s*/, '')} — готово`
                    });
                    activeTimerIds.push(tId);

                    section.innerHTML = `
                        <div class="flex flex-wrap items-start justify-between gap-2">
                            <div>
                                <h2 class="text-base font-bold text-stone-900">${block.title}</h2>
                                <p class="text-xs text-stone-600 mt-0.5 leading-relaxed">${block.instruction}</p>
                            </div>
                            ${renderStageBadgeAndAction(sIdx, totalStages)}
                        </div>
                        ${createTimerBoxHtml(
                            tId,
                            block.timerTitle,
                            block.badge,
                            `badge-${tId}`,
                            block.presets,
                            'мин',
                            Math.round(timers[tId].defaultSec / 60),
                            `setTimerMinutes('${tId}', this.value)`,
                            sIdx,
                            totalStages
                        )}
                    `;
                } else if (block.type === 'bake2') {
                    const s1Idx = stageCursor++;
                    const s2Idx = stageCursor++;
                    const hasActiveChild = (activeIdx === s1Idx || activeIdx === s2Idx);
                    section.className = hasActiveChild
                        ? 'bg-white border-2 border-emerald-300 rounded-2xl p-4 sm:p-6 shadow-sm space-y-4 transition'
                        : 'bg-white border border-stone-300 rounded-2xl p-4 sm:p-6 shadow-sm space-y-4 transition';

                    const t1Id = `${currentRecipeKey}_bake1`;
                    const t2Id = `${currentRecipeKey}_bake2`;
                    timerToStageIndex[t1Id] = s1Idx;
                    timerToStageIndex[t2Id] = s2Idx;
                    ensureTimer(t1Id, {
                        mins: block.stage1.mins,
                        showHours: false,
                        label: `${recipe.tabLabel}: этап 1 выпечки завершён`
                    });
                    ensureTimer(t2Id, {
                        mins: block.stage2.mins,
                        showHours: false,
                        label: `${recipe.tabLabel}: выпечка полностью завершена`
                    });
                    activeTimerIds.push(t1Id, t2Id);

                    section.innerHTML = `
                        <div>
                            <h2 class="text-base font-bold text-stone-900">${block.title}</h2>
                            <p class="text-xs text-stone-600 mt-0.5 leading-relaxed">${block.instruction}</p>
                        </div>
                        ${createTimerBoxHtml(
                            t1Id,
                            block.stage1.title,
                            block.stage1.temp,
                            `badge-${t1Id}`,
                            block.stage1.presets,
                            'мин',
                            Math.round(timers[t1Id].defaultSec / 60),
                            `setTimerMinutes('${t1Id}', this.value)`,
                            s1Idx,
                            totalStages
                        )}
                        ${createTimerBoxHtml(
                            t2Id,
                            block.stage2.title,
                            block.stage2.temp,
                            `badge-${t2Id}`,
                            block.stage2.presets,
                            'мин',
                            Math.round(timers[t2Id].defaultSec / 60),
                            `setTimerMinutes('${t2Id}', this.value)`,
                            s2Idx,
                            totalStages
                        )}
                    `;
                } else if (block.type === 'skillet') {
                    const sIdx = stageCursor++;
                    const isStageActive = sIdx === activeIdx;
                    section.onclick = (e) => handleStageCardClick(e, sIdx);
                    section.className = isStageActive
                        ? 'bg-emerald-50/20 border-2 border-emerald-500 ring-4 ring-emerald-500/15 rounded-2xl p-4 sm:p-6 shadow-sm space-y-4 transition cursor-pointer'
                        : 'bg-white border border-stone-300 hover:border-stone-400 rounded-2xl p-4 sm:p-6 shadow-sm space-y-4 transition cursor-pointer';

                    const pointsHtml = block.points.map((pt, idx) => `
                        <li class="flex items-start gap-2.5 text-xs sm:text-[13px] text-stone-700 leading-relaxed">
                            <span class="w-5 h-5 rounded-full bg-stone-200 text-stone-800 font-mono text-[11px] font-bold flex items-center justify-center shrink-0 mt-0.5">${idx + 1}</span>
                            <span>${pt}</span>
                        </li>
                    `).join('');

                    section.innerHTML = `
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <div class="flex flex-wrap items-center gap-2">
                                <h2 class="text-base font-bold text-stone-900">${block.title}</h2>
                                <span class="px-2.5 py-0.5 bg-amber-100 text-amber-900 font-mono text-xs font-bold rounded-md">${block.heatBadge}</span>
                            </div>
                            ${renderStageBadgeAndAction(sIdx, totalStages)}
                        </div>
                        <ul class="space-y-2.5 pt-1">${pointsHtml}</ul>
                    `;
                }

                container.appendChild(section);
            });

            activeTimerIds.forEach(id => renderTimer(id));
        }

        function toggleRecipeStep(stepIdx, checked) {
            if (!completedSteps[currentRecipeKey]) {
                completedSteps[currentRecipeKey] = {};
            }
            completedSteps[currentRecipeKey][stepIdx] = checked;
            renderWorkflow();
            saveGlobalState();
        }

        function setFermentMode(mode) {
            fermentModeByRecipe[currentRecipeKey] = mode;
            const recipe = RECIPES[currentRecipeKey];
            const fermentBlock = recipe.blocks.find(b => b.type === 'ferment2');
            const t1Id = `${currentRecipeKey}_fermentMain`;

            if (fermentBlock && timers[t1Id] && !timers[t1Id].running) {
                const defaultMins = mode === 'cold' ? fermentBlock.coldMins : fermentBlock.warmMins;
                timers[t1Id].defaultSec = defaultMins * 60;
                timers[t1Id].remainingSec = defaultMins * 60;
            }
            renderWorkflow();
            saveGlobalState();
        }

        function onFermentCustomChange(timerId, val) {
            const num = parseFloat(val);
            if (isNaN(num) || num <= 0) return;
            const isCold = (fermentModeByRecipe[currentRecipeKey] || 'warm') === 'cold';
            const mins = isCold ? Math.round(num * 60) : Math.round(num);
            setTimerMinutes(timerId, mins);
        }

        /* ==========================================================================
           УПРАВЛЕНИЕ ТАЙМЕРАМИ
           ========================================================================== */
        function formatTime(totalSec, showHours) {
            const s = Math.max(0, Math.ceil(totalSec));
            const hrs = Math.floor(s / 3600);
            const mins = Math.floor((s % 3600) / 60);
            const secs = s % 60;
            if (showHours || hrs > 0) {
                return [hrs, mins, secs].map(v => String(v).padStart(2, '0')).join(':');
            }
            return [mins, secs].map(v => String(v).padStart(2, '0')).join(':');
        }

        function formatClock(timestamp) {
            const target = new Date(timestamp);
            const now = new Date();
            const timeStr = `${String(target.getHours()).padStart(2, '0')}:${String(target.getMinutes()).padStart(2, '0')}`;

            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const targetDayStart = new Date(target.getFullYear(), target.getMonth(), target.getDate()).getTime();
            const diffDays = Math.round((targetDayStart - todayStart) / 86400000);

            if (diffDays === 0) return `в ${timeStr}`;
            if (diffDays === 1) return `завтра в ${timeStr}`;
            const day = String(target.getDate()).padStart(2, '0');
            const month = String(target.getMonth() + 1).padStart(2, '0');
            return `${day}.${month} в ${timeStr}`;
        }

        function renderTimer(id) {
            const t = timers[id];
            const displayEl = document.getElementById(`display-${id}`);
            if (!t || !displayEl) return;

            displayEl.textContent = formatTime(t.remainingSec, t.showHours);
            const btn = document.getElementById(`btn-${id}`);
            const clockEl = document.getElementById(`clock-${id}`);

            if (t.running && t.endTimestamp) {
                btn.textContent = 'Пауза';
                btn.classList.replace('bg-amber-600', 'bg-stone-600');
                btn.classList.replace('hover:bg-amber-500', 'hover:bg-stone-500');
                clockEl.textContent = `Готово ${formatClock(t.endTimestamp)}`;
            } else {
                btn.textContent = (t.remainingSec < t.defaultSec && t.remainingSec > 0) ? 'Дальше' : 'Старт';
                btn.classList.replace('bg-stone-600', 'bg-amber-600');
                btn.classList.replace('hover:bg-stone-500', 'hover:bg-amber-500');
                clockEl.textContent = t.remainingSec > 0
                    ? `Будет готово ${formatClock(Date.now() + t.remainingSec * 1000)}`
                    : 'Завершено';
            }
        }

        function applyPreset(id, mins, badgeText, badgeId) {
            if (badgeText && badgeId) {
                const badgeEl = document.getElementById(badgeId);
                if (badgeEl) badgeEl.textContent = badgeText;
            }
            setTimerMinutes(id, mins);
        }

        function setTimerMinutes(id, mins) {
            const m = Math.max(1, parseInt(mins) || 1);
            const t = timers[id];
            if (!t) return;

            t.running = false;
            t.endTimestamp = null;
            t.defaultSec = m * 60;
            t.remainingSec = m * 60;

            const customInput = document.getElementById(`custom-${id}`);
            if (customInput) {
                const isColdMain = id.endsWith('_fermentMain') && (fermentModeByRecipe[currentRecipeKey] === 'cold');
                customInput.value = isColdMain ? Math.round((m / 60) * 10) / 10 : m;
            }
            renderTimer(id);
            saveGlobalState();
        }

        function toggleTimer(id) {
            unlockAudio();
            const t = timers[id];
            if (!t) return;

            if (t.running) {
                t.remainingSec = Math.max(0, (t.endTimestamp - Date.now()) / 1000);
                t.running = false;
                t.endTimestamp = null;
            } else {
                if (t.remainingSec <= 0) {
                    t.remainingSec = t.defaultSec;
                }
                t.endTimestamp = Date.now() + t.remainingSec * 1000;
                t.running = true;

                // Запуск таймера автоматически выделяет соответствующий этап зелёной рамкой
                const linkedStage = timerToStageIndex[id];
                if (linkedStage !== undefined && activeStageByRecipe[currentRecipeKey] !== linkedStage) {
                    activeStageByRecipe[currentRecipeKey] = linkedStage;
                    renderWorkflow();
                    saveGlobalState();
                    return;
                }
            }
            renderTimer(id);
            saveGlobalState();
        }

        function resetTimer(id) {
            const t = timers[id];
            if (!t) return;

            t.running = false;
            t.endTimestamp = null;
            t.remainingSec = t.defaultSec;
            renderTimer(id);
            saveGlobalState();
        }

        /* ==========================================================================
           ЗВУКОВОЙ СИГНАЛ (WEB AUDIO API)
           ========================================================================== */
        let audioCtx = null;
        let alarmInterval = null;

        function unlockAudio() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {}
        }

        function playBeep() {
            try {
                unlockAudio();
                const now = audioCtx.currentTime;
                [880, 1174.66].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.16);
                    gain.gain.setValueAtTime(0.001, now + i * 0.16);
                    gain.gain.exponentialRampToValueAtTime(0.25, now + i * 0.16 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.16 + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.16);
                    osc.stop(now + i * 0.16 + 0.45);
                });
            } catch (e) {}
        }

        function triggerAlarm(text) {
            document.getElementById('alarmText').textContent = text;
            document.getElementById('alarmBanner').classList.remove('hidden');
            playBeep();
            if (alarmInterval) clearInterval(alarmInterval);
            alarmInterval = setInterval(playBeep, 2500);
            if (currentView === 'home') {
                renderRecipeCards();
                renderHomeActiveTimers();
            }
        }

        function stopAlarm() {
            document.getElementById('alarmBanner').classList.add('hidden');
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }

        setInterval(() => {
            const now = Date.now();
            Object.keys(timers).forEach(id => {
                const t = timers[id];
                if (t.running && t.endTimestamp) {
                    t.remainingSec = (t.endTimestamp - now) / 1000;
                    if (t.remainingSec <= 0) {
                        t.remainingSec = 0;
                        t.running = false;
                        t.endTimestamp = null;
                        triggerAlarm(t.label);
                        saveGlobalState();

                        // По окончании таймера автоматически переводим зелёную рамку на следующий этап
                        const linkedStage = timerToStageIndex[id];
                        if (linkedStage !== undefined) {
                            completeStage(linkedStage);
                            return;
                        }
                    }
                    renderTimer(id);

                    // Обновляем живой отсчёт на главной странице, если открыт каталог блюд
                    if (currentView === 'home') {
                        const timeStr = formatTime(t.remainingSec, t.showHours);
                        const homeBadge = document.getElementById(`home-timer-${id}`);
                        if (homeBadge) homeBadge.textContent = timeStr;
                        const cardBadge = document.getElementById(`card-timer-${id}`);
                        if (cardBadge) cardBadge.textContent = timeStr;
                    }
                }
            });
        }, 250);

        /* ==========================================================================
           НАВИГАЦИЯ МЕЖДУ КАТАЛОГОМ БЛЮД И СТРАНИЦЕЙ РЕЦЕПТА
           ========================================================================== */
        function saveCurrentRecipeState() {
            savedRecipeParams[currentRecipeKey] = {
                scale: currentScale,
                yeastType: yeastType,
                optionalEnabled: { ...optionalEnabled }
            };
            saveGlobalState();
        }

        function loadRecipeState(recipeKey) {
            const recipe = RECIPES[recipeKey];
            const saved = savedRecipeParams[recipeKey];
            if (saved) {
                currentScale = saved.scale;
                yeastType = saved.yeastType;
                optionalEnabled = { ...saved.optionalEnabled };
            } else {
                currentScale = 1;
                yeastType = 'dry';
                optionalEnabled = {};
                recipe.items.forEach(item => {
                    if (!item.required) {
                        optionalEnabled[item.key] = Boolean(item.defaultEnabled);
                    }
                });
            }
        }

        function openRecipe(recipeKey) {
            if (!RECIPES[recipeKey]) return;
            if (currentView === 'recipe') {
                saveCurrentRecipeState();
            }
            currentRecipeKey = recipeKey;
            loadRecipeState(recipeKey);
            currentView = 'recipe';

            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('recipeView').classList.remove('hidden');
            document.getElementById('recipeViewTitle').textContent = RECIPES[recipeKey].tabLabel;

            renderIngredients();
            renderWorkflow();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            saveGlobalState();
        }

        function goBackHome() {
            if (currentView === 'recipe') {
                saveCurrentRecipeState();
            }
            currentView = 'home';

            document.getElementById('recipeView').classList.add('hidden');
            document.getElementById('homeView').classList.remove('hidden');

            renderRecipeCards();
            renderHomeActiveTimers();
            saveGlobalState();
        }

        function renderHomeActiveTimers() {
            const container = document.getElementById('homeActiveTimers');
            if (!container) return;

            const runningEntries = Object.entries(timers).filter(([, t]) => t.running);
            if (runningEntries.length === 0) {
                container.classList.add('hidden');
                container.innerHTML = '';
                return;
            }

            container.classList.remove('hidden');
            container.innerHTML = runningEntries.map(([id, t]) => {
                const recipe = RECIPES[t.recipeKey];
                const recipeName = recipe ? recipe.tabLabel : 'Рецепт';
                const timeStr = formatTime(t.remainingSec, t.showHours);
                return `
                    <button type="button" onclick="openRecipe('${t.recipeKey}')" class="w-full flex items-center justify-between gap-3 px-4 py-2.5 bg-neutral-900 hover:bg-neutral-800 text-white rounded-xl shadow-sm transition cursor-pointer text-left">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping shrink-0"></span>
                            <div class="truncate">
                                <span class="text-xs font-bold">${recipeName}</span>
                                <span class="text-xs text-neutral-400 ml-1.5">${t.label.replace(/^[^:]+:\s*/, '')}</span>
                            </div>
                        </div>
                        <span id="home-timer-${id}" class="font-mono text-sm font-bold text-amber-400 tabular-nums shrink-0">${timeStr}</span>
                    </button>
                `;
            }).join('');
        }

        function renderRecipeCards() {
            const grid = document.getElementById('recipeCardsGrid');
            if (!grid) return;

            grid.innerHTML = RECIPE_ORDER.map(key => {
                const recipe = RECIPES[key];
                const runningEntry = Object.entries(timers).find(([, t]) => t.recipeKey === key && t.running);
                const timerBadgeHtml = runningEntry
                    ? `<div class="absolute top-2.5 right-2.5 px-2 py-1 bg-neutral-900/90 backdrop-blur-xs text-amber-400 font-mono text-xs font-bold rounded-lg flex items-center gap-1.5 shadow">
                           <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                           <span id="card-timer-${runningEntry[0]}">${formatTime(runningEntry[1].remainingSec, runningEntry[1].showHours)}</span>
                       </div>`
                    : '';

                return `
                    <button type="button" onclick="openRecipe('${key}')" class="group text-left bg-white border border-stone-300 hover:border-neutral-900 rounded-2xl overflow-hidden shadow-2xs hover:shadow-md transition flex flex-col cursor-pointer">
                        <div class="relative w-full aspect-[4/3] bg-stone-200 overflow-hidden">
                            <img src="${recipe.image}" alt="${recipe.tabLabel}" loading="lazy"
                                 onerror="this.onerror=null;this.src='https://placehold.co/400x300/e7e5e4/44403c?text=${encodeURIComponent(recipe.tabLabel)}';"
                                 class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            ${timerBadgeHtml}
                        </div>
                        <div class="p-3 sm:p-3.5 flex-1 flex flex-col justify-between gap-1">
                            <div class="font-bold text-sm sm:text-base text-stone-900 group-hover:text-black">${recipe.tabLabel}</div>
                            <div class="text-[11px] font-mono text-stone-500">${recipe.cardTag}</div>
                        </div>
                    </button>
                `;
            }).join('');
        }

        /* ==========================================================================
           КАЛЬКУЛЯТОР ИНГРЕДИЕНТОВ И ПЕРЕСЧЁТ ПО ЛЮБОМУ ПОЛЮ
           ========================================================================== */
        function getItemBase(item) {
            if (item.key === 'yeast' && item.bases) {
                return item.bases[yeastType] || item.bases.dry;
            }
            return item.base;
        }

        function getItemStep(item) {
            if (item.key === 'yeast' && item.steps) {
                return item.steps[yeastType] || item.steps.dry;
            }
            return item.step || 1;
        }

        function getItemTbspGrams(item) {
            if (item.key === 'yeast' && item.tbspGramsByType) {
                return item.tbspGramsByType[yeastType] || item.tbspGramsByType.dry;
            }
            return item.tbspGrams || 15;
        }

        function formatAmount(val) {
            if (val >= 100) return Math.round(val);
            if (val >= 10) return Math.round(val * 10) / 10;
            return Math.round(val * 10) / 10;
        }

        function formatMeasureHint(item, val) {
            if (val <= 0) return '—';
            if (item.unit === 'шт') {
                const grams = Math.round(val * (item.weightPerUnit || 55));
                return `≈ ${grams} г`;
            }

            const tbspGrams = getItemTbspGrams(item);
            const tbspRaw = val / tbspGrams;
            const tbspRounded = tbspRaw >= 10 ? Math.round(tbspRaw) : Math.round(tbspRaw * 10) / 10;
            const tbspText = tbspRaw < 0.25 ? 'щепотка' : `≈ ${tbspRounded} ст. л.`;

            if (item.isOil) {
                const ml = Math.round(val / 0.92);
                return `≈ ${ml} мл • ${tbspText}`;
            }
            if (item.isLiquid) {
                const ml = Math.round(val);
                return `≈ ${ml} мл • ${tbspText}`;
            }
            return tbspText;
        }

        function renderIngredients() {
            const recipe = RECIPES[currentRecipeKey];
            const grid = document.getElementById('ingredientsGrid');
            document.getElementById('recipeHint').textContent = recipe.hint;

            grid.innerHTML = recipe.items.map(item => {
                const isEnabled = item.required || Boolean(optionalEnabled[item.key]);
                const baseVal = getItemBase(item);
                const val = formatAmount(baseVal * currentScale);
                const unit = item.unit || 'г';
                const step = getItemStep(item);
                const hintText = isEnabled ? formatMeasureHint(item, val) : 'не добавлено';

                const headerHtml = item.required
                    ? `<span class="text-xs font-semibold text-stone-700">${item.label}</span>`
                    : `<label class="inline-flex items-center gap-1.5 text-xs font-semibold text-stone-700 cursor-pointer select-none">
                           <input type="checkbox" ${isEnabled ? 'checked' : ''} onchange="toggleOptionalIngredient('${item.key}', this.checked)" class="w-3.5 h-3.5 rounded accent-neutral-900 cursor-pointer">
                           <span>${item.label}</span>
                       </label>`;

                const yeastSwitchHtml = (item.key === 'yeast')
                    ? `<div class="inline-flex p-0.5 bg-stone-200/80 rounded-md text-[10px] font-semibold">
                           <button type="button" onclick="setYeastType('dry')" class="px-1.5 py-0.5 rounded cursor-pointer transition ${yeastType === 'dry' ? 'bg-white text-stone-900 shadow-2xs' : 'text-stone-500 hover:text-stone-800'}">Сухие</button>
                           <button type="button" onclick="setYeastType('fresh')" class="px-1.5 py-0.5 rounded cursor-pointer transition ${yeastType === 'fresh' ? 'bg-white text-stone-900 shadow-2xs' : 'text-stone-500 hover:text-stone-800'}">Живые</button>
                       </div>`
                    : '';

                return `
                    <div class="p-3 rounded-xl border transition ${isEnabled ? 'bg-stone-50/70 border-stone-200' : 'bg-stone-100/50 border-stone-200/60 opacity-60'}">
                        <div class="flex items-center justify-between gap-1 mb-1.5 min-h-[20px]">
                            ${headerHtml}
                            ${yeastSwitchHtml}
                        </div>
                        <div class="flex items-baseline gap-1.5">
                            <input type="number"
                                   id="ing-input-${item.key}"
                                   value="${val}"
                                   step="${step}"
                                   min="0"
                                   ${isEnabled ? '' : 'disabled'}
                                   oninput="onIngredientInput('${item.key}', this.value)"
                                   class="w-full bg-white border border-stone-300 focus:border-neutral-900 focus:outline-none rounded-lg px-2.5 py-1.5 font-mono text-lg font-bold text-stone-900 tabular-nums disabled:bg-stone-100 disabled:text-stone-400">
                            <span class="text-xs font-mono font-semibold text-stone-500 shrink-0">${unit}</span>
                        </div>
                        <div id="ing-hint-${item.key}" class="mt-1.5 text-[11px] font-mono text-stone-500 truncate">${hintText}</div>
                    </div>
                `;
            }).join('');

            updateTotalWeightAndWidget();
        }

        function onIngredientInput(changedKey, rawVal) {
            const num = parseFloat(rawVal);
            if (isNaN(num) || num <= 0) return;

            const recipe = RECIPES[currentRecipeKey];
            const changedItem = recipe.items.find(i => i.key === changedKey);
            if (!changedItem) return;

            const baseVal = getItemBase(changedItem);
            if (baseVal <= 0) return;

            currentScale = num / baseVal;
            saveCurrentRecipeState();

            recipe.items.forEach(item => {
                const isEnabled = item.required || Boolean(optionalEnabled[item.key]);
                const val = formatAmount(getItemBase(item) * currentScale);
                if (item.key !== changedKey) {
                    const inputEl = document.getElementById(`ing-input-${item.key}`);
                    if (inputEl) inputEl.value = val;
                }
                const hintEl = document.getElementById(`ing-hint-${item.key}`);
                if (hintEl) {
                    hintEl.textContent = isEnabled ? formatMeasureHint(item, val) : 'не добавлено';
                }
            });

            updateTotalWeightAndWidget();
        }

        function toggleOptionalIngredient(key, checked) {
            optionalEnabled[key] = checked;
            saveCurrentRecipeState();
            renderIngredients();
        }

        function setYeastType(type) {
            if (yeastType === type) return;
            yeastType = type;
            saveCurrentRecipeState();
            renderIngredients();
        }

        function scaleMultiplier(mult) {
            currentScale = mult;
            saveCurrentRecipeState();
            renderIngredients();
        }

        function updateTotalWeightAndWidget() {
            const recipe = RECIPES[currentRecipeKey];
            let totalGrams = 0;

            recipe.items.forEach(item => {
                const isEnabled = item.required || Boolean(optionalEnabled[item.key]);
                if (!isEnabled) return;
                const amount = getItemBase(item) * currentScale;
                if (item.unit === 'шт') {
                    totalGrams += amount * (item.weightPerUnit || 55);
                } else {
                    totalGrams += amount;
                }
            });

            const roundedTotal = Math.round(totalGrams);
            document.getElementById('totalWeight').textContent = roundedTotal;

            const widgetEl = document.getElementById('recipeWidget');
            if (!recipe.widgetType) {
                widgetEl.classList.add('hidden');
                widgetEl.innerHTML = '';
                return;
            }

            widgetEl.classList.remove('hidden');

            if (recipe.widgetType === 'pizzaBalls') {
                const perBall = Math.round(roundedTotal / pizzaBallsCount);
                widgetEl.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
                        <div class="flex items-center gap-1.5">
                            <span class="text-stone-600 font-medium">Деление на пиццы:</span>
                            ${[2, 3, 4].map(n => `
                                <button type="button" onclick="setPizzaBallsCount(${n})" class="px-2 py-0.5 rounded-md font-mono cursor-pointer transition ${pizzaBallsCount === n ? 'bg-neutral-900 text-white font-bold' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'}">${n} шт</button>
                            `).join('')}
                        </div>
                        <span class="font-mono font-semibold text-stone-800">1 шар ≈ ${perBall} г</span>
                    </div>
                `;
            } else if (recipe.widgetType === 'bunsSplit') {
                const perBun = Math.round(roundedTotal / bunsSplitCount);
                widgetEl.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
                        <div class="flex items-center gap-1.5">
                            <span class="text-stone-600 font-medium">Количество булочек:</span>
                            ${[6, 8, 10, 12].map(n => `
                                <button type="button" onclick="setBunsSplitCount(${n})" class="px-2 py-0.5 rounded-md font-mono cursor-pointer transition ${bunsSplitCount === n ? 'bg-neutral-900 text-white font-bold' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'}">${n} шт</button>
                            `).join('')}
                        </div>
                        <span class="font-mono font-semibold text-stone-800">1 булочка ≈ ${perBun} г</span>
                    </div>
                `;
            } else if (recipe.widgetType === 'focacciaOil') {
                const oilItem = recipe.items.find(i => i.key === 'oil');
                const oilActive = oilItem && (oilItem.required || optionalEnabled.oil);
                if (!oilActive) {
                    widgetEl.classList.add('hidden');
                    return;
                }
                const totalOil = Math.round(getItemBase(oilItem) * currentScale);
                const inDough = Math.round(totalOil * 0.5);
                const inPan = Math.round(totalOil * 0.25);
                const onTop = Math.max(0, totalOil - inDough - inPan);
                widgetEl.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-stone-600">
                        <span class="font-semibold text-stone-800">Распределение масла (${totalOil} г):</span>
                        <span class="font-mono">${inDough} г в тесто • ${inPan} г в форму • ${onTop} г сверху</span>
                    </div>
                `;
            } else if (recipe.widgetType === 'yieldEstimate') {
                const count = Math.max(1, Math.round(roundedTotal / (recipe.pieceWeight || 55)));
                widgetEl.innerHTML = `
                    <div class="flex items-center justify-between gap-2 text-xs text-stone-600">
                        <span>Ориентировочный выход:</span>
                        <span class="font-mono font-semibold text-stone-900">≈ ${count} ${recipe.pieceName || 'шт'} (по ~${recipe.pieceWeight} г)</span>
                    </div>
                `;
            }
        }

        function setPizzaBallsCount(n) {
            pizzaBallsCount = n;
            updateTotalWeightAndWidget();
            saveGlobalState();
        }

        function setBunsSplitCount(n) {
            bunsSplitCount = n;
            updateTotalWeightAndWidget();
            saveGlobalState();
        }

        // Запуск приложения и загрузка состояния
        if (loadGlobalState()) {
            if (currentView === 'recipe') {
                document.getElementById('homeView').classList.add('hidden');
                document.getElementById('recipeView').classList.remove('hidden');
                document.getElementById('recipeViewTitle').textContent = RECIPES[currentRecipeKey].tabLabel;
                
                loadRecipeState(currentRecipeKey);
                renderIngredients();
                renderWorkflow();
            } else {
                renderRecipeCards();
                renderHomeActiveTimers();
            }
        } else {
            // Первый запуск
            renderRecipeCards();
            renderHomeActiveTimers();
        }

        /* ==========================================================================
           ПОСТОЯННАЯ МОНОХРОМНАЯ WEB3-АНИМАЦИЯ НА ПРОЗРАЧНОМ ФОНЕ ШАПКИ
           ========================================================================== */
        (function initHeroCanvas() {
            const canvas = document.getElementById('bbHeroCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let width = 0;
            let height = 0;
            let dpr = 1;
            let nodes = [];
            const pulses = [];
            const pointer = { x: -9999, y: -9999 };

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                const targetCount = Math.max(18, Math.min(44, Math.floor(width / 32)));
                if (nodes.length === 0) {
                    for (let i = 0; i < targetCount; i++) {
                        nodes.push(createNode());
                    }
                } else if (nodes.length < targetCount) {
                    while (nodes.length < targetCount) nodes.push(createNode());
                } else if (nodes.length > targetCount) {
                    nodes.length = targetCount;
                }
            }

            function createNode() {
                return {
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.32,
                    vy: (Math.random() - 0.5) * 0.24,
                    radius: Math.random() < 0.28 ? 2.2 : 1.4,
                    phase: Math.random() * Math.PI * 2,
                    isSquare: Math.random() < 0.25
                };
            }

            // Плавное затухание прозрачности у самого низа, чтобы узлы растворялись без резкой границы
            function edgeAlpha(y) {
                const bottomFadeStart = height * 0.65;
                if (y <= bottomFadeStart) return 1;
                return Math.max(0, 1 - (y - bottomFadeStart) / (height - bottomFadeStart));
            }

            window.emitHeroPulse = function (clientX, clientY) {
                pulses.push({
                    x: clientX,
                    y: clientY,
                    r: 6,
                    maxR: Math.max(140, width * 0.22),
                    alpha: 0.26
                });
            };

            window.addEventListener('pointermove', (e) => {
                pointer.x = e.clientX;
                pointer.y = e.clientY;
            });

            document.addEventListener('pointerleave', () => {
                pointer.x = -9999;
                pointer.y = -9999;
            });

            window.addEventListener('click', (e) => {
                if (window.emitHeroPulse && e.isTrusted) {
                    window.emitHeroPulse(e.clientX, e.clientY);
                }
            });

            function animate(now) {
                if (width > 0 && height > 0) {
                    ctx.clearRect(0, 0, width, height);
                    const t = now * 0.001;

                    // Обновление координат узлов
                    for (let i = 0; i < nodes.length; i++) {
                        const n = nodes[i];
                        n.x += n.vx;
                        n.y += n.vy;

                        if (n.x < -12) n.x = width + 12;
                        if (n.x > width + 12) n.x = -12;
                        if (n.y < -12) n.y = height + 12;
                        if (n.y > height + 12) n.y = -12;

                        // Мягкое притяжение/отклик на курсор
                        const dx = pointer.x - n.x;
                        const dy = pointer.y - n.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist > 1 && dist < 130) {
                            const pull = (1 - dist / 130) * 0.012;
                            n.x += dx * pull;
                            n.y += dy * pull;
                        }
                    }

                    // Тонкие монохромные связи между узлами
                    const maxDist = 115;
                    ctx.lineWidth = 0.8;
                    for (let i = 0; i < nodes.length; i++) {
                        const a = nodes[i];
                        const fadeA = edgeAlpha(a.y);
                        if (fadeA <= 0.01) continue;

                        for (let j = i + 1; j < nodes.length; j++) {
                            const b = nodes[j];
                            const d = Math.hypot(a.x - b.x, a.y - b.y);
                            if (d < maxDist) {
                                const fadeB = edgeAlpha(b.y);
                                const alpha = (1 - d / maxDist) * 0.14 * Math.min(fadeA, fadeB);
                                if (alpha > 0.005) {
                                    ctx.strokeStyle = `rgba(17, 17, 17, ${alpha.toFixed(3)})`;
                                    ctx.beginPath();
                                    ctx.moveTo(a.x, a.y);
                                    ctx.lineTo(b.x, b.y);
                                    ctx.stroke();
                                }
                            }
                        }
                    }

                    // Узлы (точки и микро-квадраты в стиле периодической таблицы)
                    for (let i = 0; i < nodes.length; i++) {
                        const n = nodes[i];
                        const fade = edgeAlpha(n.y);
                        if (fade <= 0.01) continue;

                        const pulseAlpha = 0.16 + 0.1 * Math.sin(t * 1.8 + n.phase);
                        const alpha = pulseAlpha * fade;
                        ctx.fillStyle = `rgba(17, 17, 17, ${alpha.toFixed(3)})`;

                        if (n.isSquare) {
                            const s = n.radius * 2.1;
                            ctx.fillRect(n.x - s / 2, n.y - s / 2, s, s);
                        } else {
                            ctx.beginPath();
                            ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }

                    // Импульсные кольца при нажатии на шапку
                    for (let i = pulses.length - 1; i >= 0; i--) {
                        const p = pulses[i];
                        p.r += 3.2;
                        p.alpha *= 0.955;
                        if (p.r >= p.maxR || p.alpha <= 0.008) {
                            pulses.splice(i, 1);
                            continue;
                        }
                        ctx.strokeStyle = `rgba(17, 17, 17, ${p.alpha.toFixed(3)})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
