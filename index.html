<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breaking Bread</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Оригинальный Favicon (батон с паром) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231c1917'/><path d='M20 60 Q 50 20 80 60 A 30 30 0 0 1 20 60' fill='%23d97706'/><path d='M35 50 Q 45 40 55 50' stroke='%23fef3c7' stroke-width='4' fill='none' stroke-linecap='round'/><path d='M50 45 Q 60 35 70 45' stroke='%23fef3c7' stroke-width='4' fill='none' stroke-linecap='round'/></svg>">
    <style>
        body { background-color: #f5f5f4; /* stone-100 */ }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-stone-900 font-sans min-h-screen pb-20">

    <!-- Строгая ч/б шапка (Без фоновых анимаций) -->
    <header class="w-full flex flex-col items-center justify-center py-12 select-none">
        <div class="flex items-center gap-1 font-bold text-5xl tracking-tighter">
            <div class="bg-black text-white px-2 rounded-md shadow-sm border border-stone-800">Br</div>
            <div>eaking</div>
        </div>
        <div class="flex items-center gap-1 font-bold text-5xl tracking-tighter mt-1">
            <div class="bg-black text-white px-2 rounded-md shadow-sm border border-stone-800">Br</div>
            <div>ead</div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4">
        <!-- ГЛАВНЫЙ ЭКРАН -->
        <div id="home-view">
            <!-- Активные таймеры -->
            <div id="active-timers-container" class="mb-8 flex flex-col gap-2 empty:hidden"></div>

            <div class="flex justify-between items-end mb-4 px-1">
                <h2 class="text-sm font-bold text-stone-400 uppercase tracking-widest">Выберите рецепт</h2>
                <span class="text-xs font-bold text-stone-400">10 рецептов</span>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12" id="recipes-grid"></div>

            <div class="flex justify-between items-end mb-4 px-1">
                <h2 class="text-sm font-bold text-stone-400 uppercase tracking-widest">Паста и макароны</h2>
                <span class="text-xs font-bold text-stone-400">11 видов</span>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12" id="pasta-grid"></div>
        </div>

        <!-- ЭКРАН ПАСТЫ (ТАЙМЕР) -->
        <div id="pasta-view" class="hidden">
            <button onclick="goHome()" class="mb-6 font-bold text-stone-500 hover:text-black transition flex items-center gap-2">
                <span>←</span> Назад к выбору
            </button>
            <div class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden text-center p-8 max-w-sm mx-auto">
                <h2 id="pv-title" class="text-2xl font-bold mb-1">Conchiglie</h2>
                <div id="pv-brand" class="text-sm font-bold text-red-600 uppercase tracking-widest mb-8">RUMMO NO 42</div>
                
                <div class="relative w-56 h-56 mx-auto mb-6 flex items-center justify-center">
                    <svg class="absolute inset-0 w-full h-full transform -rotate-90 overflow-visible">
                        <circle cx="112" cy="112" r="100" stroke="#f5f5f4" stroke-width="12" fill="none"/>
                        <!-- Засечка Al Dente рисуется программно -->
                        <line id="pv-aldente-mark" x1="112" y1="2" x2="112" y2="22" stroke="#1c1917" stroke-width="4" stroke-linecap="round" class="hidden"/>
                        <circle id="pv-progress" cx="112" cy="112" r="100" stroke="#f97316" stroke-width="12" fill="none" stroke-dasharray="628" stroke-dashoffset="628" class="transition-all duration-1000 linear"/>
                    </svg>
                    <div class="z-10 flex flex-col items-center">
                        <div id="pv-time" class="text-4xl font-bold font-mono tracking-tight mb-1">00:00</div>
                        <div id="pv-status" class="text-xs font-bold text-stone-400 uppercase tracking-widest">До Al Dente</div>
                    </div>
                </div>
                
                <button id="pv-btn" onclick="togglePastaTimer()" class="w-full py-4 rounded-xl font-bold text-white bg-black shadow-lg hover:bg-stone-800 transition active:scale-95">Старт</button>
            </div>
            
            <!-- БЛОК МИНИ-ИГР -->
            <div class="mt-12 bg-white p-6 rounded-2xl shadow-sm border border-stone-200 max-w-sm mx-auto">
                <div class="text-center font-bold text-stone-400 text-xs uppercase tracking-widest mb-4">Таймкиллеры</div>
                <div class="flex p-1 bg-stone-100 rounded-xl mb-6">
                    <button onclick="setGame('snake')" id="btn-snake" class="flex-1 py-1.5 rounded-lg text-sm font-bold bg-black text-white shadow transition-all">Змейка</button>
                    <button onclick="setGame('2048')" id="btn-2048" class="flex-1 py-1.5 rounded-lg text-sm font-bold text-stone-500 hover:text-black transition-all">2048</button>
                    <button onclick="setGame('minesweeper')" id="btn-minesweeper" class="flex-1 py-1.5 rounded-lg text-sm font-bold text-stone-500 hover:text-black transition-all">Сапер</button>
                </div>
                <!-- Контейнер игры -->
                <div id="game-container" class="w-[300px] h-[300px] mx-auto bg-stone-900 rounded-xl relative overflow-hidden select-none outline-none" tabindex="0"></div>
            </div>
        </div>
    </main>

    <script>
        // БАЗА ДАННЫХ
        const RECIPES = [
            { id: 'bread', name: 'Хлеб', img: 'img/bread.jpg', desc: 'Классика · 240° / 210°' },
            { id: 'pizza', name: 'Пицца', img: 'img/pizza.jpg', desc: 'Тонкая · 220°' },
            { id: 'lavash', name: 'Лаваш', img: 'img/lavash.jpg', desc: 'Сковорода' },
            { id: 'buns', name: 'Булочки', img: 'img/Breakfast.jpg', desc: 'К завтраку' },
            { id: 'flatbread', name: 'Лепёшка', img: 'img/Flatbread.jpg', desc: 'Духовка · 230°' },
            { id: 'ciabatta', name: 'Чиабатта', img: 'img/Ciabatta.jpg', desc: 'Влажное тесто' },
            { id: 'focaccia', name: 'Фокачча', img: 'img/Focaccia.jpg', desc: 'С оливковым маслом' },
            { id: 'blinchik', name: 'Блинчики', img: 'img/blinchik.jpg', desc: 'Тонкие' },
            { id: 'pancake', name: 'Панкейки', img: 'img/Pancake.jpg', desc: 'Пышные' },
            { id: 'cookies', name: 'Печенье', img: 'img/cookies.jpg', desc: 'Американское' }
        ];

        const PASTAS = [
            { id: 'p1', brand: 'RUMMO', num: 'No 42', name: 'Conchiglie Rigate', img: 'img/paste/Conchiglie.jpeg', time: 11 },
            { id: 'p2', brand: 'RUMMO', num: 'No 3', name: 'Spaghetti', img: 'img/paste/Spaghetti.jpg', time: 10 },
            { id: 'p3', brand: 'RUMMO', num: 'No 66', name: 'Penne Rigate', img: 'img/paste/Penne.jpg', time: 11 },
            { id: 'p4', brand: 'RUMMO', num: 'No 48', name: 'Integrale Fusilli', img: 'img/paste/integraleFusilli.jpg', time: 10 },
            { id: 'p5', brand: 'RUMMO', num: 'No 48', name: 'Fusilli', img: 'img/paste/Fusilli.jpg', time: 11 },
            { id: 'p6', brand: 'RUMMO', num: 'No 51', name: 'Mezzi Rigatoni', img: 'img/paste/rigatoni.jpg', time: 14 },
            { id: 'p7', brand: 'RUMMO', num: 'No 85', name: 'Farfalle', img: 'img/paste/Farfalle.jpg', time: 12 },
            { id: 'p8', brand: 'RUMMO', num: 'No 13', name: 'Linguine', img: 'img/paste/Linguine.jpg', time: 10 },
            { id: 'p9', brand: 'RUMMO', num: '', name: 'Perunagnocchi', img: 'img/paste/Perunagnocchi.jpg', time: 3 },
            { id: 'p10', brand: 'BARILLA', num: 'No 16', name: 'Tagliatelle', img: 'img/paste/Tagliatelle.jpg', time: 6 },
            { id: 'p11', brand: 'BARILLA', num: 'n.5', name: 'Spaghetti', img: 'img/paste/Spaghetti.jpg', time: 9 }
        ];

        // ИНИЦИАЛИЗАЦИЯ
        function initApp() {
            // Рендер карточек рецептов (заглушки)
            document.getElementById('recipes-grid').innerHTML = RECIPES.map(r => `
                <div class="bg-white rounded-xl overflow-hidden shadow-sm border border-stone-200 transition opacity-60">
                    <div class="h-32 bg-stone-200 flex items-center justify-center text-xs font-bold text-stone-400">RECIPE (WIP)</div>
                    <div class="p-3 text-center">
                        <div class="font-bold text-black text-sm">${r.name}</div>
                        <div class="text-[10px] uppercase font-bold text-stone-400 mt-1">${r.desc}</div>
                    </div>
                </div>
            `).join('');

            // Рендер карточек пасты
            document.getElementById('pasta-grid').innerHTML = PASTAS.map(p => `
                <div onclick="openPasta('${p.id}')" class="bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-md border border-stone-200 cursor-pointer transition active:scale-95">
                    <img src="${p.img}" class="w-full h-44 object-cover" alt="${p.name}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiNlN2U1ZTQiLz48L3N2Zz4='">
                    <div class="p-4 text-center border-t border-stone-100">
                        <div class="font-bold text-lg leading-tight mb-1 text-black">${p.name}</div>
                        <div class="text-xs font-bold text-red-600 uppercase tracking-widest">${p.brand} <span class="text-black">${p.num}</span></div>
                    </div>
                </div>
            `).join('');
            
            // Запускаем первую мини-игру по умолчанию
            setGame('snake');
            setInterval(updateGlobalTimers, 1000);
        }

        // НАВИГАЦИЯ
        function goHome() {
            document.getElementById('pasta-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
            activePastaId = null;
        }

        // ЛОГИКА ТАЙМЕРА ПАСТЫ
        let activePastaId = null;
        let pastaState = JSON.parse(localStorage.getItem('pastaState')) || { id: null, endTime: null, totalSec: 0 };
        let pastaInterval = null;

        function openPasta(id) {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('pasta-view').classList.remove('hidden');
            activePastaId = id;
            const p = PASTAS.find(x => x.id === id);
            
            document.getElementById('pv-title').innerText = p.name;
            document.getElementById('pv-brand').innerHTML = `${p.brand} <span class="text-black">${p.num}</span>`;
            
            // Расчет позиции засечки Al Dente (1.5 минуты = 90 сек)
            const totalSec = p.time * 60;
            const AL_DENTE_OFFSET = 90;
            const pct = (totalSec - AL_DENTE_OFFSET) / totalSec;
            const angle = pct * 360 * (Math.PI/180);
            // cx=112 cy=112 r=100
            const x = 112 + 100 * Math.cos(angle);
            const y = 112 + 100 * Math.sin(angle);
            
            const mark = document.getElementById('pv-aldente-mark');
            mark.setAttribute('x1', 112 + 90 * Math.cos(angle));
            mark.setAttribute('y1', 112 + 90 * Math.sin(angle));
            mark.setAttribute('x2', 112 + 110 * Math.cos(angle));
            mark.setAttribute('y2', 112 + 110 * Math.sin(angle));
            mark.classList.remove('hidden');

            renderPastaTimer();
        }

        function togglePastaTimer() {
            if (pastaState.endTime && pastaState.id === activePastaId) {
                // Остановка
                pastaState = { id: null, endTime: null, totalSec: 0 };
            } else {
                // Запуск
                const p = PASTAS.find(x => x.id === activePastaId);
                pastaState = { id: p.id, totalSec: p.time * 60, endTime: Date.now() + p.time * 60 * 1000 };
            }
            localStorage.setItem('pastaState', JSON.stringify(pastaState));
            renderPastaTimer();
        }

        function formatTime(sec) {
            if (sec < 0) sec = 0;
            return `${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`;
        }

        function renderPastaTimer() {
            if (!activePastaId) return;
            const p = PASTAS.find(x => x.id === activePastaId);
            const btn = document.getElementById('pv-btn');
            const progress = document.getElementById('pv-progress');
            const timeEl = document.getElementById('pv-time');
            const statusEl = document.getElementById('pv-status');
            const AL_DENTE_OFFSET = 90; 

            if (pastaState.id === activePastaId && pastaState.endTime) {
                btn.innerText = "Сбросить";
                btn.classList.replace('bg-black', 'bg-stone-300');
                btn.classList.replace('text-white', 'text-black');

                const left = Math.max(0, Math.floor((pastaState.endTime - Date.now()) / 1000));
                const elapsed = pastaState.totalSec - left;
                const alDenteSec = pastaState.totalSec - AL_DENTE_OFFSET;
                
                const dashPct = Math.min(elapsed / pastaState.totalSec, 1);
                progress.style.strokeDashoffset = 628 - (dashPct * 628);

                // Логика перехода цветов
                if (elapsed < alDenteSec) {
                    progress.setAttribute('stroke', '#f97316'); // Оранжевый до альденте
                    timeEl.innerText = formatTime(alDenteSec - elapsed);
                    statusEl.innerText = "До Al Dente";
                    statusEl.classList.replace('text-green-500', 'text-stone-400');
                } else {
                    progress.setAttribute('stroke', '#22c55e'); // Зеленый после альденте
                    timeEl.innerText = formatTime(left);
                    statusEl.innerText = left > 0 ? "Al Dente! До готовности" : "Готово!";
                    statusEl.classList.replace('text-stone-400', 'text-green-500');
                }
            } else {
                btn.innerText = "Старт";
                btn.classList.replace('bg-stone-300', 'bg-black');
                btn.classList.replace('text-black', 'text-white');
                progress.style.strokeDashoffset = 628;
                progress.setAttribute('stroke', '#f97316');
                timeEl.innerText = formatTime(p.time * 60 - AL_DENTE_OFFSET);
                statusEl.innerText = "До Al Dente";
                statusEl.classList.replace('text-green-500', 'text-stone-400');
            }
        }

        function updateGlobalTimers() {
            renderPastaTimer();
            // Глобальный баннер на главном экране
            const gt = document.getElementById('active-timers-container');
            if (!pastaState.endTime || activePastaId) {
                gt.innerHTML = ''; return;
            }
            const left = Math.floor((pastaState.endTime - Date.now()) / 1000);
            if (left <= -10) { pastaState.endTime = null; localStorage.removeItem('pastaState'); return; }
            
            const p = PASTAS.find(x => x.id === pastaState.id);
            const isAlDente = (pastaState.totalSec - left) >= (pastaState.totalSec - 90);
            
            gt.innerHTML = `
                <div onclick="openPasta('${p.id}')" class="bg-black text-white rounded-xl p-4 flex justify-between items-center cursor-pointer shadow-lg hover:bg-stone-800 transition">
                    <div class="flex items-center gap-3">
                        <div class="w-2 h-2 rounded-full ${isAlDente ? 'bg-green-500' : 'bg-orange-500'} animate-pulse"></div>
                        <span class="font-bold text-sm">${p.name}</span>
                        <span class="text-xs text-stone-400">· ${isAlDente ? 'Доваривается' : 'До Al Dente'}</span>
                    </div>
                    <div class="font-mono font-bold text-lg ${isAlDente ? 'text-green-400' : 'text-orange-400'}">${formatTime(Math.max(0, left))}</div>
                </div>
            `;
        }

        // ==========================================
        // МИНИ-ИГРЫ
        // ==========================================
        window.cleanupGame = null;

        function setGame(gameName) {
            if (window.cleanupGame) { window.cleanupGame(); window.cleanupGame = null; }
            ['snake', '2048', 'minesweeper'].forEach(g => {
                const btn = document.getElementById('btn-' + g);
                if (g === gameName) {
                    btn.className = "flex-1 py-1.5 rounded-lg text-sm font-bold bg-black text-white shadow transition-all";
                } else {
                    btn.className = "flex-1 py-1.5 rounded-lg text-sm font-bold text-stone-500 hover:text-black hover:bg-stone-200 transition-all";
                }
            });
            const c = document.getElementById('game-container');
            c.innerHTML = '';
            c.focus(); // Для клавиатуры
            if (gameName === 'snake') initSnake(c);
            if (gameName === '2048') init2048(c);
            if (gameName === 'minesweeper') initMinesweeper(c);
        }

        // ЗМЕЙКА
        function initSnake(container) {
            container.innerHTML = `<canvas id="snake-cvs" width="300" height="300" class="w-full h-full bg-stone-900"></canvas>`;
            const ctx = document.getElementById('snake-cvs').getContext('2d');
            let snake = [{x: 10, y: 10}], dir = {x: 0, y: -1}, food = {x: 15, y: 5};
            
            const kd = (e) => {
                if(e.key === 'ArrowUp' && dir.y === 0) dir = {x: 0, y: -1};
                if(e.key === 'ArrowDown' && dir.y === 0) dir = {x: 0, y: 1};
                if(e.key === 'ArrowLeft' && dir.x === 0) dir = {x: -1, y: 0};
                if(e.key === 'ArrowRight' && dir.x === 0) dir = {x: 1, y: 0};
                if(e.key.startsWith('Arrow')) e.preventDefault();
            };
            container.addEventListener('keydown', kd);
            
            let interval = setInterval(() => {
                let h = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
                if (h.x < 0 || h.x >= 20 || h.y < 0 || h.y >= 20 || snake.some(s => s.x === h.x && s.y === h.y)) {
                    snake = [{x: 10, y: 10}]; dir = {x: 0, y: -1}; return; // Сброс при смерти
                }
                snake.unshift(h);
                if (h.x === food.x && h.y === food.y) {
                    food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
                } else snake.pop();
                
                ctx.fillStyle = '#1c1917'; ctx.fillRect(0, 0, 300, 300); // Фон
                ctx.fillStyle = '#f97316'; ctx.fillRect(food.x * 15 + 1, food.y * 15 + 1, 13, 13); // Еда
                ctx.fillStyle = '#f5f5f4'; snake.forEach(s => ctx.fillRect(s.x * 15 + 1, s.y * 15 + 1, 13, 13)); // Змея
            }, 120);
            
            window.cleanupGame = () => { clearInterval(interval); container.removeEventListener('keydown', kd); };
        }

        // 2048
        function init2048(container) {
            let board = Array(16).fill(0);
            const addTile = () => {
                let empty = board.map((v, i) => v === 0 ? i : -1).filter(i => i !== -1);
                if (empty.length) board[empty[Math.floor(Math.random() * empty.length)]] = Math.random() > 0.9 ? 4 : 2;
            };
            addTile(); addTile();

            const render = () => {
                const colors = { 0: 'bg-stone-800 text-transparent', 2: 'bg-stone-300 text-stone-900', 4: 'bg-stone-200 text-stone-900', 8: 'bg-orange-200 text-orange-900', 16: 'bg-orange-300 text-orange-900', 32: 'bg-orange-400 text-white', 64: 'bg-orange-500 text-white', 128: 'bg-yellow-400 text-white', 256: 'bg-yellow-500 text-white', 512: 'bg-yellow-600 text-white', 1024: 'bg-black text-white', 2048: 'bg-black text-white outline outline-4 outline-yellow-400' };
                container.innerHTML = `<div class="grid grid-cols-4 gap-2 w-full h-full p-2 bg-stone-900">${board.map(v => `<div class="flex items-center justify-center font-bold text-xl rounded-md ${colors[v] || 'bg-black text-white outline'}" style="transition: background 0.1s">${v}</div>`).join('')}</div>`;
            };

            const slide = (arr) => {
                let res = arr.filter(v => v);
                for (let i = 0; i < res.length - 1; i++) {
                    if (res[i] === res[i+1]) { res[i] *= 2; res.splice(i+1, 1); }
                }
                while (res.length < 4) res.push(0);
                return res;
            };

            const move = (dx, dy) => {
                let changed = false;
                for (let i = 0; i < 4; i++) {
                    let idx = dx !== 0 ? [i*4, i*4+1, i*4+2, i*4+3] : [i, i+4, i+8, i+12];
                    if (dx === 1 || dy === 1) idx.reverse();
                    let row = idx.map(j => board[j]);
                    let newRow = slide(row);
                    idx.forEach((j, k) => { if (board[j] !== newRow[k]) changed = true; board[j] = newRow[k]; });
                }
                if (changed) { addTile(); render(); }
            };

            const kd = (e) => {
                if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
                if (e.key === 'ArrowUp') move(0, -1);
                if (e.key === 'ArrowDown') move(0, 1);
                if (e.key === 'ArrowLeft') move(-1, 0);
                if (e.key === 'ArrowRight') move(1, 0);
            };
            container.addEventListener('keydown', kd);
            window.cleanupGame = () => container.removeEventListener('keydown', kd);
            render();
        }

        // САПЕР
        function initMinesweeper(container) {
            const COLS = 10, MINES = 12;
            let grid = Array(COLS*COLS).fill(0).map(() => ({ mine: false, rev: false, flag: false, adj: 0 }));
            let minesPlanted = 0, firstClick = true;

            const render = () => {
                container.innerHTML = `<div class="grid grid-cols-10 w-full h-full bg-stone-900 gap-px p-1 border-2 border-stone-900 rounded-xl overflow-hidden">${grid.map((c, i) => {
                    let bg = c.rev ? 'bg-stone-200' : 'bg-stone-400 hover:bg-stone-300 cursor-pointer shadow-[inset_0_-2px_0_rgba(0,0,0,0.2)]';
                    let txt = c.flag ? '🚩' : (c.rev ? (c.mine ? '💣' : (c.adj || '')) : '');
                    let color = ['','text-blue-600','text-green-600','text-red-600','text-purple-600'][c.adj] || 'text-black';
                    return `<div onclick="msReveal(${i})" oncontextmenu="event.preventDefault(); msFlag(${i})" class="flex items-center justify-center font-bold text-xs select-none ${bg} ${color}">${txt}</div>`;
                }).join('')}</div>`;
            };

            window.msReveal = (i) => {
                if (grid[i].rev || grid[i].flag) return;
                
                // Расстановка мин после первого клика
                if (firstClick) {
                    firstClick = false;
                    while(minesPlanted < MINES) {
                        let idx = Math.floor(Math.random() * (COLS*COLS));
                        if (!grid[idx].mine && idx !== i) { grid[idx].mine = true; minesPlanted++; }
                    }
                    grid.forEach((c, idx) => {
                        let x = idx%COLS, y = Math.floor(idx/COLS), adj = 0;
                        for(let dy=-1; dy<=1; dy++) for(let dx=-1; dx<=1; dx++) {
                            let nx=x+dx, ny=y+dy;
                            if(nx>=0 && nx<COLS && ny>=0 && ny<COLS && grid[ny*COLS+nx].mine) adj++;
                        }
                        c.adj = adj;
                    });
                }
                
                grid[i].rev = true;
                if (grid[i].mine) { setTimeout(() => { alert('Бум!'); initMinesweeper(container); }, 50); return; }
                
                if (grid[i].adj === 0) {
                    let q = [i];
                    while (q.length) {
                        let curr = q.pop(), x = curr%COLS, y = Math.floor(curr/COLS);
                        for(let dy=-1; dy<=1; dy++) for(let dx=-1; dx<=1; dx++) {
                            let nx=x+dx, ny=y+dy, ni=ny*COLS+nx;
                            if(nx>=0 && nx<COLS && ny>=0 && ny<COLS && !grid[ni].rev && !grid[ni].flag) {
                                grid[ni].rev = true;
                                if (grid[ni].adj === 0) q.push(ni);
                            }
                        }
                    }
                }
                render();
            };

            window.msFlag = (i) => {
                if (!grid[i].rev) grid[i].flag = !grid[i].flag;
                render();
            };
            
            window.cleanupGame = () => { delete window.msReveal; delete window.msFlag; };
            render();
        }

        window.onload = initApp;
    </script>
</body>
</html>
